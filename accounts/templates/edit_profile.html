{% extends 'base.html' %}
{% block title %} Editar Perfil | SERCONN{% endblock %}

{% block content %}
<main>
    <div class="max-w-lg mx-auto bg-white rounded-2xl shadow p-6">
        <h2 class="text-2xl font-bold text-indigo-700 mb-4">Editar información</h2>

        <form method="post" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}
            {{ form.as_p }}

            {% if provider_form %}
                {{ provider_form.as_p }}
            {% endif %}


            <div class="flex justify-between">
                <a href="{% url 'profile' %}" class="px-4 py-2 bg-gray-400 text-white rounded-lg">Cancelar</a>
                <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Guardar cambios</button>
            </div>
        </form>

    </div>
</main>
{% endblock %}
